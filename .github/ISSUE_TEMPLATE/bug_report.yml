name: Bug Report
description: Report a bug or unexpected behavior
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Please fill out the sections below.
        Do NOT paste real domains, secrets, or `.env` contents.

  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Minimal steps to reproduce the behavior.
      placeholder: |
        1. Set `.env` with ...
        2. Run `docker compose up -d`
        3. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: Include relevant `docker compose logs` output (redacted).
    validations:
      required: true

  - type: dropdown
    id: profile
    attributes:
      label: Which configuration?
      options:
        - Core (Ghost + MySQL + nginx)
        - analytics profile
        - activitypub profile
        - Multiple / all profiles
    validations:
      required: true

  - type: input
    id: compose-version
    attributes:
      label: Docker / Compose version
      description: Output of `docker compose version`
      placeholder: "Docker Compose version v2.x.x"
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Host Operating System
      options:
        - Linux (Ubuntu/Debian)
        - Linux (Other)
        - macOS
        - Windows
    validations:
      required: true

  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Any other context, logs, or screenshots (redacted).
