name: Gitleaks

# Scans the working tree and (on push) full git history for committed secrets.
# Critical for a repo that is being opened to the public.

on:
  push:
    branches: ["main"]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gitleaks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          # Full history so the scan covers every past commit, not just HEAD.
          fetch-depth: 0
          persist-credentials: false

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Note: gitleaks-action requires a GITLEAKS_LICENSE secret only for
          # GitHub *organization* accounts. Personal/public repos need nothing.
          # Add `GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}` here if this
          # repo is moved under an organization.
