name: zizmor

# Audits the GitHub Actions workflows themselves for security issues
# (script injection, excessive permissions, unpinned actions, credential
# persistence, etc.) and uploads findings to the Security tab.

on:
  push:
    branches: ["main"]
    paths: [".github/workflows/**"]
  pull_request:
    paths: [".github/workflows/**"]
  schedule:
    - cron: "0 6 * * 6"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zizmor-${{ github.ref }}
  cancel-in-progress: true

jobs:
  zizmor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"

      - name: Install zizmor
        # Pinned to an exact version. Inline `pip install` isn't covered by
        # Renovate's managers, so bump this by hand when adopting a new release.
        run: pip install zizmor==1.27.0

      - name: Run zizmor
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: zizmor --persona regular --format sarif . > zizmor.sarif

      - name: Upload zizmor SARIF
        uses: github/codeql-action/upload-sarif@54f647b7e1bb85c95cddabcd46b0c578ec92bc1a # v4
        if: always()
        with:
          sarif_file: zizmor.sarif
          category: zizmor
