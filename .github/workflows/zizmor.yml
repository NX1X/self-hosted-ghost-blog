name: zizmor

# Audits the GitHub Actions workflows themselves for security issues
# (script injection, excessive permissions, unpinned actions, credential
# persistence, etc.) and uploads findings to the Security tab.

on:
  push:
    branches: ["main"]
    paths: [".github/workflows/**"]
  # No path filter on PRs: `zizmor` is a required status check, so it must run on
  # every pull request (a path-filtered required check blocks any PR that doesn't
  # touch the filtered paths). It re-audits the workflows quickly either way.
  pull_request:
  schedule:
    - cron: "0 6 * * 6"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zizmor-${{ github.ref }}
  cancel-in-progress: true

jobs:
  zizmor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14.7"

      - name: Install zizmor
        # Pinned to an exact version. Inline `pip install` isn't covered by
        # Renovate's managers, so bump this by hand when adopting a new release.
        run: pip install zizmor==1.27.0

      - name: Run zizmor
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: zizmor --persona regular --config .github/zizmor.yml --format sarif . > zizmor.sarif

      - name: Upload zizmor SARIF
        uses: github/codeql-action/upload-sarif@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4
        if: always()
        with:
          sarif_file: zizmor.sarif
          category: zizmor
