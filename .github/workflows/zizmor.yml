name: zizmor

# Audits the GitHub Actions workflows themselves for security issues
# (script injection, excessive permissions, unpinned actions, credential
# persistence, etc.) and uploads findings to the Security tab.

on:
  push:
    branches: ["main"]
    paths: [".github/workflows/**"]
  pull_request:
    paths: [".github/workflows/**"]
  schedule:
    - cron: "0 6 * * 6"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zizmor-${{ github.ref }}
  cancel-in-progress: true

jobs:
  zizmor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14.6"

      - name: Install zizmor
        # Pinned to an exact version. Inline `pip install` isn't covered by
        # Renovate's managers, so bump this by hand when adopting a new release.
        run: pip install zizmor==1.27.0

      - name: Run zizmor
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: zizmor --persona regular --format sarif . > zizmor.sarif

      - name: Upload zizmor SARIF
        uses: github/codeql-action/upload-sarif@08d09a53f0f5d694f253bd25732e4429c9e9337f # v3
        if: always()
        with:
          sarif_file: zizmor.sarif
          category: zizmor
