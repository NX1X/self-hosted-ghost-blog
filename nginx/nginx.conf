events {
    worker_connections 1024;
}

http {
    # DNS resolver for Docker container names
    resolver 127.0.0.11 valid=30s ipv6=off;

    # Basic settings
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 256;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml font/woff2 application/font-woff2;

    # Proxy buffering: buffer Ghost responses before sending to client
    proxy_buffering on;
    proxy_buffer_size 4k;
    proxy_buffers 8 16k;
    proxy_busy_buffers_size 32k;

    # Logging
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    # Hide nginx version
    server_tokens off;

    # Rate limiting zones - adjust these values for your traffic patterns
    limit_req_zone $binary_remote_addr zone=general:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=scanner:10m rate=1r/m;
    limit_req_zone $binary_remote_addr zone=admin:10m rate=30r/m;
    limit_req_status 429;

    # Map bad bot user agents - customize this list for your needs
    map $http_user_agent $bad_bot {
        default 0;
        # Add scanning tools and automated clients you want to block
        ~*(masscan|nmap|sqlmap|nikto|openvas|acunetix|nessus|metasploit) 1;
        ~*(python-requests|curl|wget|scrapy|go-http-client) 1;
        "" 1;  # Empty user agent
    }

    # HTTP server - redirect to HTTPS
    # Replace example.com with your actual domain(s)
    server {
        listen 80;
        server_name example.com admin.example.com;
        return 301 https://$server_name$request_uri;
    }

    # HTTPS server - main domain
    server {
        listen 443 ssl;
        http2 on;
        server_name example.com;

        # SSL configuration
        ssl_certificate /etc/nginx/ssl/cert.pem;
        ssl_certificate_key /etc/nginx/ssl/key.pem;
        ssl_session_cache shared:SSL:1m;
        ssl_session_timeout 5m;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;

        # OCSP stapling (uses the http-level resolver above). For full stapling
        # verification, point ssl_trusted_certificate at your CA chain / fullchain.
        ssl_stapling on;
        ssl_stapling_verify on;

        # Security headers
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Content-Security-Policy "frame-ancestors 'self'" always;
        # Strip backend technology headers to reduce fingerprinting
        proxy_hide_header X-Powered-By;
        proxy_hide_header X-Ghost-Analytics;

        # Block bad bots immediately
        if ($bad_bot) {
            return 403;
        }

        # Block common scanner paths - customize this list for your setup
        location ~ (/\.env|/\.git|/\.sql|/\.bak|/config\.php|/phpmyadmin|/actuator|/remote/login|/ecp/|app_dev\.php|phpinfo|/wp-admin|/wp-login|/xmlrpc) {
            limit_req zone=scanner burst=1 nodelay;
            access_log off;
            return 444;
        }

        # Ghost admin - consider protecting with an access control layer
        # (IP allowlist, VPN, Cloudflare Access / mTLS). At minimum, throttle
        # login/brute-force attempts using the dedicated admin zone.
        location ^~ /ghost/ {
            limit_req zone=admin burst=10 nodelay;

            set $ghost_upstream ghost:2368;
            proxy_pass http://$ghost_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;

            # Ghost requires Origin header on admin API requests.
            # Some proxies/tunnels may strip the Origin header, so ensure it's always set.
            proxy_set_header Origin https://$host;

            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # Traffic Analytics - Proxy analytics requests
        location ~* ^/.ghost/analytics/(.*)$ {
            # Use variable to force DNS resolution at request time
            set $analytics_upstream traffic-analytics:3000;
            proxy_pass http://$analytics_upstream/$1$is_args$args;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        # ActivityPub endpoints
        location /.ghost/activitypub/ {
            # Use variable to force DNS resolution at request time
            set $activitypub_upstream activitypub:8080;
            proxy_pass http://$activitypub_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        location /.well-known/webfinger {
            # Use variable to force DNS resolution at request time
            set $activitypub_upstream activitypub:8080;
            proxy_pass http://$activitypub_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        location /.well-known/nodeinfo {
            # Use variable to force DNS resolution at request time
            set $activitypub_upstream activitypub:8080;
            proxy_pass http://$activitypub_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        # Static asset caching: images, fonts, CSS, JS served by Ghost
        # Ghost uses cache-busting query strings (?v=...) so 1-year TTL is safe
        location ~* ^/(?:content|public|assets)/.*\.(?:jpg|jpeg|png|gif|ico|svg|webp|avif|woff2?|ttf|eot|otf|css|js)$ {
            set $ghost_upstream ghost:2368;
            proxy_pass http://$ghost_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            expires 1y;
            access_log off;
        }

        # Default - proxy everything else to Ghost with rate limiting
        location / {
            # Apply general rate limiting to prevent abuse
            limit_req zone=general burst=20 nodelay;

            # Use variable to force DNS resolution at request time, not startup
            set $ghost_upstream ghost:2368;
            proxy_pass http://$ghost_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Host $host;

            # Increase proxy timeouts for Ghost
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }
    }

    # HTTPS server - admin domain
    server {
        listen 443 ssl;
        http2 on;
        server_name admin.example.com;

        # SSL configuration (same certs work for both domains)
        ssl_certificate /etc/nginx/ssl/cert.pem;
        ssl_certificate_key /etc/nginx/ssl/key.pem;
        ssl_session_cache shared:SSL:1m;
        ssl_session_timeout 5m;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;

        # OCSP stapling (uses the http-level resolver above). For full stapling
        # verification, point ssl_trusted_certificate at your CA chain / fullchain.
        ssl_stapling on;
        ssl_stapling_verify on;

        # Security headers
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Content-Security-Policy "frame-ancestors 'self'" always;

        # Admin domain - redirect to Ghost admin
        location / {
            return 301 https://example.com/ghost/;
        }
    }
}